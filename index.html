<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dízimo — Paróquia São Miguel Arcanjo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #F5F1E7;
    --cream-line: #E4DDC9;
    --dark: #1C1712;
    --dark-soft: #3A322A;
    --gold: #C9A24A;
    --gold-deep: #A9852F;
    --brick: #A8402F;
    --brick-hover: #8F3226;
    --white: #FFFFFF;
    --muted: #7A7266;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #EDEAE1;
    color: var(--dark);
  }
  input, select, button { font-family: inherit; font-size: 14px; }
  .serif { font-family: 'Playfair Display', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  /* ---------- Login ---------- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--cream);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 12px 30px rgba(28,23,18,0.18);
  }
  .login-badge {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; color: var(--gold);
    margin: 0 auto 12px;
  }
  .login-card h1 { text-align: center; font-size: 18px; margin: 0 0 4px; }
  .login-card p.sub { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 20px; }

  .campo { margin-bottom: 12px; }
  .campo label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .campo input, .campo select, .campo textarea {
    width: 100%; border: 1px solid var(--cream-line); border-radius: 8px;
    padding: 9px 10px; background: var(--white); color: var(--dark);
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: 2px solid var(--gold); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 24px; padding: 10px 18px;
    font-weight: 700; font-size: 12.5px; letter-spacing: 0.3px; text-transform: uppercase;
    cursor: pointer; background: var(--brick); color: var(--white);
  }
  .btn:hover { background: var(--brick-hover); }
  .btn.full { width: 100%; }
  .btn.outline {
    background: transparent; color: var(--dark); border: 1.5px solid var(--dark);
  }
  .btn.small { padding: 6px 12px; font-size: 11px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.perigo { background: transparent; color: var(--brick); border: 1.5px solid var(--brick); }
  .btn.perigo:hover { background: #F6DFDF; }

  .erro {
    background: #F6DFDF; color: #7A2A21; border: 1px solid #E3B5AC;
    border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin-bottom: 12px;
  }
  .sucesso {
    background: #DCEAE7; color: #1F5A50; border: 1px solid #B7D6CF;
    border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin-bottom: 12px;
  }

  /* ---------- Shell / header ---------- */
  header.topbar {
    background: var(--dark); color: var(--white);
    padding: 12px 18px; display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar .brand { display: flex; align-items: center; gap: 10px; }
  header.topbar .badge {
    width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; color: var(--gold); font-size: 12px;
  }
  header.topbar .titulo { font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; }
  header.topbar .sub { font-size: 10px; color: var(--gold); }
  header.topbar .sair { background: transparent; border: 1px solid var(--white); color: var(--white); border-radius: 16px; padding: 6px 12px; font-size: 11px; cursor: pointer; }

  nav.tabs { display: flex; gap: 8px; padding: 14px 18px 0; flex-wrap: wrap; }
  nav.tabs button {
    border-radius: 20px; border: 1.5px solid var(--cream-line); background: var(--white);
    color: var(--dark-soft); padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  nav.tabs button.ativo { background: var(--dark); border-color: var(--dark); color: var(--white); }

  main { max-width: 900px; margin: 0 auto; padding: 18px; }
  .cartao {
    background: var(--white); border: 1px solid var(--cream-line); border-radius: 10px;
    padding: 16px; margin-bottom: 16px;
  }
  .cartao h2 { font-size: 14px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dark-soft); }

  .linha-lista {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 10px; border-bottom: 1px dashed var(--cream-line); font-size: 13px;
  }
  .linha-lista:last-child { border-bottom: none; }
  .linha-lista .codigo { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); margin-right: 6px; }

  .pill-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .pill-toggle button {
    flex: 1; padding: 7px 0; border-radius: 20px; border: 1px solid var(--cream-line);
    background: transparent; color: var(--muted); font-weight: 600; font-size: 12px; cursor: pointer;
  }
  .pill-toggle button.ativo { background: var(--brick); color: var(--white); border-color: var(--brick); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

  .metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 640px) { .metricas { grid-template-columns: 1fr; } }
  .metrica { background: var(--white); border: 1px solid var(--cream-line); border-radius: 10px; padding: 14px 16px; }
  .metrica .label { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .metrica .valor { font-family: 'IBM Plex Mono', monospace; font-size: 21px; font-weight: 700; }

  table.relatorio { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.relatorio th { text-align: left; border-bottom: 1.5px solid var(--dark); padding: 6px 4px; color: var(--muted); font-weight: 600; }
  table.relatorio td { padding: 7px 4px; border-bottom: 1px dashed var(--cream-line); }
  table.relatorio td.num { text-align: right; font-family: 'IBM Plex Mono', monospace; }

  .tag-data {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700; color: var(--brick);
    background: var(--cream); padding: 4px 8px; border-radius: 6px;
  }
  .vazio { text-align: center; color: var(--muted); font-size: 12.5px; padding: 20px 0; }
  .carimbo {
    display: inline-block; border: 2px solid var(--brick); color: var(--brick);
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 3px; transform: rotate(-3deg); text-transform: uppercase;
  }
  .muted { color: var(--muted); font-size: 12px; }
  .link-sel { color: var(--brick); font-size: 11px; font-weight: 600; cursor: pointer; background: none; border: none; }

  .barra-linha { display: grid; grid-template-columns: 160px 1fr 90px; align-items: center; gap: 10px; padding: 6px 0; }
  .barra-nome { font-size: 12px; color: var(--dark-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra-trilha { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--cream); }
  .barra-segmento { height: 100%; }
  .barra-valor { font-size: 12px; text-align: right; font-weight: 700; }
  .legenda-cores { display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
  .legenda-cores span { display: flex; align-items: center; gap: 4px; }
  .legenda-cores i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  @media (max-width: 640px) {
    .barra-linha { grid-template-columns: 1fr; gap: 2px; }
    .barra-valor { text-align: left; }
  }

  .serie-grafico { display: flex; align-items: flex-end; gap: 10px; height: 220px; overflow-x: auto; padding: 8px 4px 0; }
  .serie-coluna { display: flex; flex-direction: column; align-items: center; min-width: 42px; height: 100%; justify-content: flex-end; }
  .serie-barra { width: 26px; display: flex; flex-direction: column-reverse; border-radius: 3px 3px 0 0; overflow: hidden; background: var(--cream); }
  .serie-segmento { width: 100%; }
  .serie-label { font-size: 9.5px; color: var(--muted); margin-top: 6px; white-space: nowrap; }
  .serie-total { font-size: 9px; color: var(--dark-soft); font-family: 'IBM Plex Mono', monospace; margin-bottom: 2px; }

  .comp-grafico { display: flex; align-items: flex-end; gap: 14px; height: 230px; overflow-x: auto; padding: 8px 4px 0; }
  .comp-coluna { display: flex; flex-direction: column; align-items: center; min-width: 56px; height: 100%; justify-content: flex-end; }
  .comp-barras { display: flex; align-items: flex-end; gap: 3px; }
  .comp-barra { width: 16px; border-radius: 3px 3px 0 0; }
  .comp-pct { font-size: 10px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; }
  .comp-label { font-size: 9.5px; color: var(--muted); margin-top: 6px; white-space: nowrap; }
</style>
</head>

async function api(path, opts = {}) {
  const headers = opts.headers ? { ...opts.headers } : {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  if (opts.body && !(opts.body instanceof FormData) && typeof opts.body !== "string") {
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  } else if (opts.body && typeof opts.body === "string") {
    headers["Content-Type"] = "application/json";
  }
  const res = await fetch(API_BASE + path, { ...opts, headers });
  if (res.status === 401) {
    logout();
    throw new Error("Sessão expirada. Faça login novamente.");
  }
  if (!res.ok) {
    let msg = "Erro na requisição (" + res.status + ")";
    try {
      const corpo = await res.json();
      if (corpo.detail) msg = typeof corpo.detail === "string" ? corpo.detail : JSON.stringify(corpo.detail);
    } catch (e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function apiLogin(login, senha) {
  const form = new URLSearchParams();
  form.append("username", login);
  form.append("password", senha);
  const res = await fetch(API_BASE + "/auth/login", { method: "POST", body: form });
  if (!res.ok) throw new Error("Login ou senha incorretos");
  return res.json();
}

function logout() {
  state.token = null;
  state.usuario = null;
  localStorage.removeItem("dizimo_token");
  render();
}

/* =========================================================
   FORMATAÇÃO
   ========================================================= */
function fmtMoeda(v) {
  const n = typeof v === "string" ? parseFloat(v) : v;
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function hojeISO() {
  return new Date().toISOString().slice(0, 10);
}
function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
async function init() {
  if (state.token) {
    try {
      state.usuario = await api("/auth/eu");
      state.comunidades = await api("/comunidades");
    } catch (e) {
      state.token = null;
      state.usuario = null;
    }
  }
  render();
}

/* =========================================================
   RENDER RAIZ
   ========================================================= */
function render() {
  const app = document.getElementById("app");
  if (!state.token || !state.usuario) {
    app.innerHTML = renderLogin();
    attachLoginHandlers();
    return;
  }
  app.innerHTML = renderShell();
  attachShellHandlers();
}

async function buscarEnderecoPorCep(cepInputId, numeroInputId, enderecoInputId, statusId) {
  const cepDigits = document.getElementById(cepInputId).value.replace(/\D/g, "");
  const statusEl = document.getElementById(statusId);
  if (cepDigits.length !== 8) {
    statusEl.textContent = "";
    return null;
  }
  statusEl.textContent = "Buscando endereço...";
  try {
    const res = await fetch(`https://viacep.com.br/ws/${cepDigits}/json/`);
    const dados = await res.json();
    if (dados.erro) {
      statusEl.textContent = "CEP não encontrado — preencha o endereço manualmente.";
      return null;
    }
    statusEl.textContent = `${dados.logradouro || ""}${dados.logradouro && dados.bairro ? " - " : ""}${dados.bairro || ""}, ${dados.localidade}/${dados.uf}`;
    return dados;
  } catch (e) {
    statusEl.textContent = "Não foi possível buscar o CEP agora — preencha o endereço manualmente.";
    return null;
  }
}

function comporEndereco(dadosCep, numero, enderecoInputId) {
  if (!dadosCep) return;
  const partes = [];
  if (dadosCep.logradouro) {
    partes.push(dadosCep.logradouro + (numero ? ", nº " + numero : ""));
  } else if (numero) {
    partes.push("nº " + numero);
  }
  if (dadosCep.bairro) partes.push(dadosCep.bairro);
  if (dadosCep.localidade) partes.push(dadosCep.localidade + (dadosCep.uf ? "/" + dadosCep.uf : ""));
  document.getElementById(enderecoInputId).value = partes.join(" - ");
}

function ligarAutoPreenchimentoCep(prefixo) {
  let ultimoCep = null;
  let timeoutCep;
  const cepInput = document.getElementById(`${prefixo}-cep`);
  const numeroInput = document.getElementById(`${prefixo}-numero`);
  if (!cepInput || !numeroInput) return;

  cepInput.addEventListener("input", () => {
    clearTimeout(timeoutCep);
    timeoutCep = setTimeout(async () => {
      ultimoCep = await buscarEnderecoPorCep(`${prefixo}-cep`, `${prefixo}-numero`, `${prefixo}-endereco`, `${prefixo}-cep-status`);
      comporEndereco(ultimoCep, numeroInput.value.trim(), `${prefixo}-endereco`);
    }, 500);
  });
  numeroInput.addEventListener("input", () => {
    comporEndereco(ultimoCep, numeroInput.value.trim(), `${prefixo}-endereco`);
  });
}

function attachAbaDizimoHandlers() {
  if (state.dizimistaSelecionado) {
    attachFormularioContribuicaoHandlers();
    return;

  const inputBusca = document.getElementById("busca-dizimista");
  const renderizarResultados = async () => {
    const termo = inputBusca.value.trim();
    state.buscaDizimista = termo;
    const container = document.getElementById("resultados-busca");
    if (!termo) {
      container.innerHTML = "";
      return;
    }
    try {
      const resultados = await api("/dizimistas?busca=" + encodeURIComponent(termo));
      state.resultadosBusca = resultados;
      container.innerHTML = resultados.length
        ? resultados
            .map(
              (d) => `
          <div class="linha-lista">
            <span><span class="codigo mono">${escapeHtml(d.codigo || "—")}</span>${escapeHtml(d.nome)}</span>

            )
            .join("")
        : `<div class="vazio">Nenhum dizimista encontrado.</div>`;
      container.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const dizimista = state.resultadosBusca.find((d) => d.id === Number(btn.dataset.id));

          document.getElementById("conteudo").innerHTML = renderTesoureiro();

        });
      });

      container.innerHTML = `<div class="erro">${escapeHtml(err.message)}</div>`;
    }
  };
  let timeoutBusca;
  inputBusca.addEventListener("input", () => {
    clearTimeout(timeoutBusca);
    timeoutBusca = setTimeout(renderizarResultados, 250);
  });
  if (state.buscaDizimista) renderizarResultados();

  carregarListaContribuicoes();

  document.getElementById("btn-avulso").addEventListener("click", () => {
    state.dizimistaSelecionado = "avulso";
    document.getElementById("conteudo").innerHTML = renderTesoureiro();
    attachTesoureiroHandlers();
  });

  attachFormularioNovoDizimistaHandlers(state.usuario.comunidade_id, () => {
    document.getElementById("conteudo").innerHTML = renderTesoureiro();
    attachTesoureiroHandlers();
  });
}

async function baixarArquivoProtegido(btn, url, nomeArquivo, mensagemGerando) {
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = mensagemGerando || "Gerando...";
  try {
    const res = await fetch(url, { headers: { Authorization: "Bearer " + state.token } });
    if (res.status === 401) {
      logout();
      return;
    }
    if (!res.ok) throw new Error("Não foi possível gerar o arquivo (erro " + res.status + ")");
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objectUrl);
  } catch (err) {
    alert(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

    graficoDiv.innerHTML = `

            return `

function _corVariacao(pct) {
  if (pct === null || pct === undefined) return "var(--muted)";
  return pct >= 0 ? "#2C6E63" : "var(--brick)";
}

function _textoVariacao(pct) {
  if (pct === null || pct === undefined) return "—";
  const seta = pct >= 0 ? "▲" : "▼";
  const sinal = pct >= 0 ? "+" : "";
  return `${seta} ${sinal}${pct.toFixed(1)}%`;
}

async function carregarBalancoComparativo(granularidade) {
  const graficoDiv = document.getElementById("bl-grafico");
  const tabelaDiv = document.getElementById("bl-tabela");
  if (!graficoDiv) return;
  const comunidadeId = document.getElementById("bl-comunidade").value;
  const qtd = QTD_PADRAO_COMPARATIVO[granularidade];
  const params = new URLSearchParams({ granularidade, periodos: qtd });
  if (comunidadeId) params.set("comunidade_id", comunidadeId);

  try {
    const dados = await api("/relatorios/comparativo-periodo?" + params.toString());
    const maior = Math.max(1, ...dados.periodos.flatMap((p) => [Number(p.total), Number(p.total_ano_anterior)]));

    graficoDiv.innerHTML = `
      <div class="comp-grafico">
        ${dados.periodos
          .map((p) => {
            const alturaAtual = Math.round((Number(p.total) / maior) * 180);
            const alturaAnterior = Math.round((Number(p.total_ano_anterior) / maior) * 180);
            return `
              <div class="comp-coluna">
                <div class="comp-pct" style="color:${_corVariacao(p.variacao_percentual)};">${_textoVariacao(p.variacao_percentual)}</div>
                <div class="comp-barras">
                  <div class="comp-barra" style="height:${Math.max(alturaAtual, 2)}px; background:var(--dark);" title="${escapeHtml(p.label)}: ${fmtMoeda(p.total)}"></div>
                  <div class="comp-barra" style="height:${Math.max(alturaAnterior, 2)}px; background:var(--gold);" title="Ano anterior: ${fmtMoeda(p.total_ano_anterior)}"></div>
                </div>
                <div class="comp-label">${escapeHtml(p.label)}</div>
              </div>
            `;
          })
          .join("")}
      </div>
    `;

    tabelaDiv.innerHTML = `
      <div style="overflow-x:auto;">
      <table class="relatorio">
        <thead><tr><th>Período</th><th>Atual</th><th>Ano anterior</th><th>Variação</th></tr></thead>
        <tbody>
          ${dados.periodos

function _setaVariacao(pct) {
  if (pct === null || pct === undefined) return `<span class="muted">sem base de comparação</span>`;
  const cor = pct > 0 ? "#2C6E63" : pct < 0 ? "var(--brick)" : "var(--muted)";
  const seta = pct > 0 ? "▲" : pct < 0 ? "▼" : "—";
  return `<span style="color:${cor}; font-weight:700;">${seta} ${Math.abs(pct).toFixed(1)}%</span>`;
}

async function gerarEtiquetasPdf(btn) {
  const erroDiv = document.getElementById("et-erro");
  erroDiv.innerHTML = "";
  const comunidadeId = document.getElementById("et-comunidade").value;
  if (!comunidadeId) {
    erroDiv.innerHTML = `<div class="erro">Escolha uma comunidade primeiro.</div>`;
    return;
  }
  const apenasAtivos = document.getElementById("et-apenas-ativos").checked;
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Gerando...";
  try {
    const url = `${API_BASE}/dizimistas/etiquetas?comunidade_id=${comunidadeId}&apenas_ativos=${apenasAtivos}`;
    const res = await fetch(url, { headers: { Authorization: "Bearer " + state.token } });
    if (res.status === 401) {
      logout();
      return;
    }
    if (!res.ok) {
      const corpo = await res.json().catch(() => ({}));
      throw new Error(corpo.detail || "Não foi possível gerar as etiquetas (erro " + res.status + ")");
    }
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = "etiquetas.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objectUrl);
  } catch (err) {
    erroDiv.innerHTML = `<div class="erro">${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

        .map(([nome, qtd]) => `<div class="linha-lista"><span>${escapeHtml(nome)}</span><span class="mono">${qtd}</span></div>`)
        .join("");
      resultadoDiv.innerHTML = `<div class="sucesso">${resultado.total_renovados} códigos renovados.</div>${linhasPorComunidade}`;
      carregarCadastroDizimistas();
      carregarContagem();
    } catch (err) {
      resultadoDiv.innerHTML = `<div class="erro">${escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  });
}

async function carregarFormEdicaoDizimista() {
  const wrap = document.getElementById("cd-form-wrap");
  try {
    const lista = await api("/dizimistas?busca=");
    const dizimista = lista.find((d) => d.id === state.dizimistaEditandoId);
    if (!dizimista) {
      wrap.innerHTML = `<div class="erro">Dizimista não encontrado.</div>`;
      return;
    }
    wrap.innerHTML = `
      <div class="cartao">
        <button class="link-sel" id="cd-voltar" style="margin-bottom:10px;">&larr; voltar à lista</button>
        <h2>Editar dizimista</h2>
        <form id="form-editar-dizimista">
          <div class="grid2">
            <div class="campo"><label>Código</label><div class="mono" style="padding:9px 10px; background:var(--cream); border:1px solid var(--cream-line); border-radius:8px; color:var(--dark-soft);">${escapeHtml(dizimista.codigo || "—")} <span class="muted" style="font-family:'Inter',sans-serif;">(gerado automaticamente)</span></div></div>
            <div class="campo"><label>Nome completo *</label><input type="text" id="ed-nome" value="${escapeHtml(dizimista.nome)}" required /></div>
          </div>
          <div class="campo">
            <label>CPF</label>
            <div style="display:flex; gap:8px; align-items:center;">
              <input type="text" id="ed-cpf" value="" placeholder="${dizimista.cpf_mascarado || "não cadastrado"}" style="flex:1;" />
              ${dizimista.cpf_mascarado ? `<button type="button" class="btn outline small" id="ed-revelar-cpf" style="white-space:nowrap;">Revelar</button>` : ""}
            </div>
            <div id="ed-cpf-revelado" class="muted" style="margin-top:4px;"></div>
          </div>
          <div class="grid2">
            <div class="campo">
              <label>Comunidade</label>
              <select id="ed-comunidade">
                ${state.comunidades.map((c) => `<option value="${c.id}" ${c.id === dizimista.comunidade_id ? "selected" : ""}>${escapeHtml(c.nome)}</option>`).join("")}
              </select>
            </div>
            <div class="campo">
              <label>Status</label>
              <select id="ed-status">
                ${["ativo", "inativo", "falecido"].map((s) => `<option value="${s}" ${s === dizimista.status ? "selected" : ""}>${s}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="grid2">
            <div class="campo"><label>Data de nascimento</label><input type="date" id="ed-nascimento" value="${dizimista.data_nascimento || ""}" /></div>
            <div class="campo"><label>Telefone</label><input type="text" id="ed-telefone" value="${escapeHtml(dizimista.telefone || "")}" /></div>
          </div>
          <div class="grid2">
            <div class="campo"><label>CEP</label><input type="text" id="ed-cep" value="${escapeHtml(dizimista.cep || "")}" placeholder="00000-000" /></div>
            <div class="campo"><label>Número</label><input type="text" id="ed-numero" /></div>
          </div>
          <div id="ed-cep-status" class="muted" style="margin:-6px 0 10px;"></div>
          <div class="campo"><label>Endereço</label><input type="text" id="ed-endereco" value="${escapeHtml(dizimista.endereco || "")}" /></div>
          <div id="ed-erro"></div>
          <div id="ed-sucesso"></div>
          <button type="submit" class="btn full">Salvar alterações</button>
        </form>
        <button type="button" class="btn perigo full" id="ed-excluir" style="margin-top:10px;">Excluir dizimista</button>
      </div>
    `;
    ligarAutoPreenchimentoCep("ed");
    if (dizimista.cpf_mascarado) {
      document.getElementById("ed-revelar-cpf").addEventListener("click", async (e) => {
        const btn = e.target;
        const alvo = document.getElementById("ed-cpf-revelado");
        btn.disabled = true;
        try {
          const resultado = await api(`/dizimistas/${dizimista.id}/cpf`);
          alvo.textContent = `CPF completo: ${resultado.cpf}`;
        } catch (err) {
          alvo.innerHTML = `<span style="color:var(--brick);">${escapeHtml(err.message)}</span>`;
        } finally {
          btn.disabled = false;
        }
      });
    }
    document.getElementById("cd-voltar").addEventListener("click", () => {
      state.dizimistaEditandoId = null;
      document.getElementById("conteudo").innerHTML = renderGestao();
      attachGestaoHandlers();
    });
    document.getElementById("ed-excluir").addEventListener("click", async () => {
      if (!confirm(`Excluir "${dizimista.nome}"? Essa ação não pode ser desfeita.`)) return;
      const erroDiv = document.getElementById("ed-erro");
      erroDiv.innerHTML = "";
      try {
        await api(`/dizimistas/${dizimista.id}`, { method: "DELETE" });
        state.dizimistaEditandoId = null;
        document.getElementById("conteudo").innerHTML = renderGestao();
        attachGestaoHandlers();
      } catch (err) {
        erroDiv.innerHTML = `<div class="erro">${escapeHtml(err.message)}</div>`;
      }
    });
    document.getElementById("form-editar-dizimista").addEventListener("submit", async (e) => {
      e.preventDefault();
      const erroDiv = document.getElementById("ed-erro");
      const sucessoDiv = document.getElementById("ed-sucesso");
      erroDiv.innerHTML = "";
      sucessoDiv.innerHTML = "";
      const cpfDigitado = document.getElementById("ed-cpf").value.trim();
      const corpo = {
        nome: document.getElementById("ed-nome").value.trim(),
        comunidade_id: Number(document.getElementById("ed-comunidade").value),
        status: document.getElementById("ed-status").value,
        data_nascimento: document.getElementById("ed-nascimento").value || null,
        telefone: document.getElementById("ed-telefone").value.trim() || null,
        cep: document.getElementById("ed-cep").value.trim() || null,
        endereco: document.getElementById("ed-endereco").value.trim() || null,
      };
      if (cpfDigitado) corpo.cpf = cpfDigitado; // só manda se a secretaria digitou algo novo
      try {
        await api(`/dizimistas/${dizimista.id}`, { method: "PATCH", body: corpo });
        sucessoDiv.innerHTML = `<div class="sucesso">Alterações salvas.</div>`;
      } catch (err) {
        erroDiv.innerHTML = `<div class="erro">${escapeHtml(err.message)}</div>`;
      }
    });
  } catch (err) {
    wrap.innerHTML = `<div class="erro">${escapeHtml(err.message)}</div>`;
  }
}

/* ----- Usuários (tesoureiros + secretaria) ----- */
function renderCadastroUsuarios() {
  if (state.usuarioFormAberto || state.usuarioEditandoId) return `<div id="cu-form-wrap">Carregando...</div>`;
  return `
    <div class="cartao">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 style="margin:0;">Usuários</h2>
        <button class="btn small" id="btn-novo-usuario">+ Novo usuário</button>
      </div>
      <div id="cu-lista">Carregando...</div>
    </div>
  `;
}

async function carregarCadastroUsuarios() {
  const container = document.getElementById("cu-lista");
  if (!container) return;
  try {
    const lista = await api("/usuarios");
    container.innerHTML = lista.length
      ? lista
          .map(
            (u) => `
        <div class="linha-lista">
          <span>
            ${escapeHtml(u.nome)}
            <span class="muted"> · ${u.login} · ${u.perfil === "secretaria" ? "secretaria/pároco" : escapeHtml(nomeComunidade(u.comunidade_id))}${!u.ativo ? " · inativo" : ""}</span>
          </span>
          <button class="link-sel" data-id="${u.id}">editar</button>
        </div>`
          )
          .join("")
      : `<div class="vazio">Nenhum usuário cadastrado.</div>`;
    container.querySelectorAll("button[data-id]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.usuarioEditandoId = Number(btn.dataset.id);
        document.getElementById("conteudo").innerHTML = renderGestao();
        attachGestaoHandlers();
      });
    });
  } catch (err) {
    container.innerHTML = `<div class="erro">${escapeHtml(err.message)}</div>`;
  }
}

function attachCadastroUsuariosHandlers() {
  if (state.usuarioFormAberto) {
    montarFormUsuario(null);
    return;
  }
  if (state.usuarioEditandoId) {
    carregarFormEdicaoUsuario();
    return;
  }
  carregarCadastroUsuarios();
  document.getElementById("btn-novo-usuario").addEventListener("click", () => {
    state.usuarioFormAberto = true;
    document.getElementById("conteudo").innerHTML = renderGestao();
    attachGestaoHandlers();
  });
}

function montarFormUsuario(usuarioExistente) {
  const wrap = document.getElementById("cu-form-wrap");
  const editando = !!usuarioExistente;
  wrap.innerHTML = `
    <div class="cartao">
      <button class="link-sel" id="cu-voltar" style="margin-bottom:10px;">&larr; voltar à lista</button>
      <h2>${editando ? "Editar usuário" : "Novo usuário"}</h2>
      <form id="form-usuario">
        <div class="campo"><label>Nome completo *</label><input type="text" id="cu-nome" value="${editando ? escapeHtml(usuarioExistente.nome) : ""}" required /></div>
        <div class="grid2">
          <div class="campo"><label>Login *</label><input type="text" id="cu-login" value="${editando ? escapeHtml(usuarioExistente.login) : ""}" ${editando ? "disabled" : ""} required /></div>
          <div class="campo"><label>${editando ? "Nova senha (deixe em branco pra manter)" : "Senha *"}</label><input type="password" id="cu-senha" ${editando ? "" : "required"} /></div>
        </div>
        <div class="grid2">
          <div class="campo">
            <label>Perfil *</label>
            <select id="cu-perfil" ${editando ? "disabled" : ""}>
              <option value="tesoureiro" ${editando && usuarioExistente.perfil === "tesoureiro" ? "selected" : ""}>Tesoureiro</option>
              <option value="secretaria" ${editando && usuarioExistente.perfil === "secretaria" ? "selected" : ""}>Secretaria / pároco</option>
            </select>
          </div>
          <div class="campo" id="cu-campo-comunidade">
            <label>Comunidade</label>
            <select id="cu-comunidade">
              ${state.comunidades.map((c) => `<option value="${c.id}" ${editando && c.id === usuarioExistente.comunidade_id ? "selected" : ""}>${escapeHtml(c.nome)}</option>`).join("")}
            </select>
          </div>
        </div>
        ${editando ? `<div class="campo"><label><input type="checkbox" id="cu-ativo" ${usuarioExistente.ativo ? "checked" : ""} style="width:auto; margin-right:6px;" />Usuário ativo</label></div>` : ""}
        <div id="cu-erro"></div>
        <div id="cu-sucesso"></div>
        <button type="submit" class="btn full">${editando ? "Salvar alterações" : "Criar usuário"}</button>
      </form>
      ${editando ? `<button type="button" class="btn perigo full" id="cu-excluir" style="margin-top:10px;">Excluir usuário</button>` : ""}
    </div>
  `;

  document.getElementById("cu-voltar").addEventListener("click", () => {
    state.usuarioFormAberto = false;
    state.usuarioEditandoId = null;
    document.getElementById("conteudo").innerHTML = renderGestao();
    attachGestaoHandlers();
  });

  if (editando) {
    document.getElementById("cu-excluir").addEventListener("click", async () => {
      if (!confirm(`Excluir o usuário "${usuarioExistente.nome}"? Essa ação não pode ser desfeita.`)) return;
      const erroDiv = document.getElementById("cu-erro");
      erroDiv.innerHTML = "";
      try {
        await api(`/usuarios/${usuarioExistente.id}`, { method: "DELETE" });
        state.usuarioFormAberto = false;
        state.usuarioEditandoId = null;
        document.getElementById("conteudo").innerHTML = renderGestao();
        attachGestaoHandlers();
      } catch (err) {
        erroDiv.innerHTML = `<div class="erro">${escapeHtml(err.message)}</div>`;
      }
    });
  }

  const selectPerfil = document.getElementById("cu-perfil");
  const campoComunidade = document.getElementById("cu-campo-comunidade");
  function atualizarVisibilidadeComunidade() {
    campoComunidade.style.display = selectPerfil.value === "tesoureiro" ? "" : "none";
  }
  atualizarVisibilidadeComunidade();
  selectPerfil.addEventListener("change", atualizarVisibilidadeComunidade);

  document.getElementById("form-usuario").addEventListener("submit", async (e) => {
    e.preventDefault();
    const erroDiv = document.getElementById("cu-erro");
    const sucessoDiv = document.getElementById("cu-sucesso");
    erroDiv.innerHTML = "";
    sucessoDiv.innerHTML = "";
    const perfil = selectPerfil.value;
    const senha = document.getElementById("cu-senha").value;

    try {
      if (editando) {
        const corpo = {
          nome: document.getElementById("cu-nome").value.trim(),
          ativo: document.getElementById("cu-ativo").checked,
        };
        if (perfil === "tesoureiro") corpo.comunidade_id = Number(document.getElementById("cu-comunidade").value);
        if (senha) corpo.senha = senha;
        await api(`/usuarios/${usuarioExistente.id}`, { method: "PATCH", body: corpo });
        sucessoDiv.innerHTML = `<div class="sucesso">Alterações salvas.</div>`;
      } else {
        const corpo = {
          nome: document.getElementById("cu-nome").value.trim(),
          login: document.getElementById("cu-login").value.trim(),
          senha,
          perfil,
          comunidade_id: perfil === "tesoureiro" ? Number(document.getElementById("cu-comunidade").value) : null,
        };
        await api("/usuarios", { method: "POST", body: corpo });
        sucessoDiv.innerHTML = `<span class="carimbo">Criado ✓</span>`;
        document.getElementById("form-usuario").reset();
      }
    } catch (err) {
      erroDiv.innerHTML = `<div class="erro">${escapeHtml(err.message)}</div>`;
    }
  });
}

async function carregarFormEdicaoUsuario() {
  const wrap = document.getElementById("cu-form-wrap");
  try {
    const lista = await api("/usuarios");
    const usuario = lista.find((u) => u.id === state.usuarioEditandoId);
    if (!usuario) {
      wrap.innerHTML = `<div class="erro">Usuário não encontrado.</div>`;
      return;
    }
    montarFormUsuario(usuario);
  } catch (err) {
    wrap.innerHTML = `<div class="erro">${escapeHtml(err.message)}</div>`;
  }
}

/* =========================================================
   START

init();
</script>
